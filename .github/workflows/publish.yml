name: Publish to npm
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write   # npm Trusted Publishing (OIDC) + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # Trusted Publishing needs npm >= 11.5.1
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm publish --provenance --access public   # authenticated via OIDC, no token
